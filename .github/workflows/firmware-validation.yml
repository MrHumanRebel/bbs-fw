name: Firmware validation
on:
  pull_request:
    branches: [main, master]
    paths:
      - src/firmware/**
      - tests/**
      - ci/**
      - research/efficiency/**
      - .github/workflows/firmware-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    if: github.repository == 'MrHumanRebel/bbs-fw'
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        controller: [BBS02, BBSHD, TSDZ2]
    steps:
      - name: Install pinned compiler and simulator
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git make gcc libc6-dev python3 \
            sdcc=4.5.0+dfsg-1 sdcc-libraries=4.5.0+dfsg-1 sdcc-ucsim=4.5.0+dfsg-1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test host behavior and release automation
        if: matrix.controller == 'BBS02'
        run: |
          sh tests/run.sh
          python3 -m unittest discover -s ci/tests -v
      - name: Build and check memory budgets
        env:
          CONTROLLER: ${{ matrix.controller }}
        run: |
          make -C src/firmware clean
          make -C src/firmware -j1 all TARGET_CONTROLLER="$CONTROLLER"
          python3 ci/check_firmware_size.py "$CONTROLLER" src/firmware
      - name: Compare shipped arithmetic against legacy formulas
        env:
          CONTROLLER: ${{ matrix.controller }}
        run: |
          python3 tests/run_target_conversion.py --controller "$CONTROLLER"
          python3 tests/run_target_control.py --controller "$CONTROLLER"
          SENSOR_DIRECTORY=bbsx
          if [ "$CONTROLLER" = TSDZ2 ]; then SENSOR_DIRECTORY=tsdz2; fi
          python3 tests/run_target_sensors.py --controller "$CONTROLLER" \
            --assembly "src/firmware/$SENSOR_DIRECTORY/sensors.asm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firmware-validation-${{ matrix.controller }}
          path: |
            src/firmware/bbs-fw.hex
            src/firmware/bbs-fw.map
            src/firmware/bbs-fw.mem
          if-no-files-found: error
