name: Build and release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Each commit gets its own run. Do not cancel older commits when a new one lands.
jobs:
  tests:
    if: >-
      github.repository == 'MrHumanRebel/bbs-fw' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Release automation tests
        run: python3 -m unittest discover -s ci/tests -v
      - name: Firmware host regression tests
        run: sh tests/run.sh
      - name: Configuration and telemetry tests
        run: dotnet run --project tests/ConfigurationTests --configuration Release

  version:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Reserve version for this exact commit
        id: version
        run: python3 ci/release_version.py --commit "$GITHUB_SHA"

  firmware:
    needs: version
    runs-on: ubuntu-24.04
    container: debian:13
    strategy:
      fail-fast: false
      matrix:
        controller: [BBS02, BBSHD, TSDZ2]
    steps:
      - name: Install pinned firmware toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git make python3 \
            sdcc=4.5.0+dfsg-1 sdcc-libraries=4.5.0+dfsg-1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build firmware
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CONTROLLER: ${{ matrix.controller }}
        run: |
          make -C src/firmware clean
          make -C src/firmware -j1 all TARGET_CONTROLLER="$CONTROLLER" VERSION="$VERSION"
          mkdir -p dist
          cp src/firmware/bbs-fw.hex "dist/bbs-fw-v$VERSION-$CONTROLLER.hex"
          python3 -c 'import sys; from pathlib import Path; from ci.validate_release import validate_hex; validate_hex(Path(sys.argv[1]))' "dist/bbs-fw-v$VERSION-$CONTROLLER.hex"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firmware-${{ matrix.controller }}
          path: dist/*.hex
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Publish standalone and compact Windows x64 tools
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet publish src/tool/bbs-fw-tool.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=$env:VERSION -p:AssemblyVersion="${env:VERSION}.0" -p:FileVersion="${env:VERSION}.0" `
            -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish/BBSFWTool.exe "dist/BBSFWTool-v${env:VERSION}-win-x64.exe"
          dotnet publish src/tool/bbs-fw-tool.csproj -c Release -r win-x64 --self-contained false `
            -p:Version=$env:VERSION -p:AssemblyVersion="${env:VERSION}.0" -p:FileVersion="${env:VERSION}.0" `
            -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:EnableCompressionInSingleFile=false `
            -p:DebugType=None -p:DebugSymbols=false -o publish-compact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item publish-compact/BBSFWTool.exe "dist/BBSFWTool-v${env:VERSION}-win-x64-compact.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-tool
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [version, firmware, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Only repeated publications of the SAME tag are serialized.
    concurrency:
      group: publish-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true
      - name: Validate all downloads and write SHA256SUMS
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 ci/validate_release.py dist "$VERSION"
      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          python3 ci/publish_release.py "$TAG" dist
