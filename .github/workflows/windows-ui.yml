name: Windows UI validation
on:
  pull_request:
    branches: [main, master]
    paths:
      - src/tool/**
      - tests/WindowsUiTests/**
      - .github/workflows/windows-ui.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    if: github.repository == 'MrHumanRebel/bbs-fw'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Validate both themes, card layout and curve bindings
        run: dotnet run --project tests/WindowsUiTests --configuration Release -- ui-preview
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: windows-ui-preview
          path: ui-preview/*.png
          if-no-files-found: warn
          retention-days: 7
